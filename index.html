<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M Shopping Hub | Premium Direct Purchase Marketplace</title>
    <meta name="description" content="A modern, premium, mobile-friendly marketplace featuring curated products with direct purchase links, role-based admin controls, and interactive user saves and reviews." />
    <meta name="keywords" content="M Shopping Hub, Raza, Welcome from Raza, online shopping, direct purchase links, verified brands, authentic electronics, fashion, lifestyle" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Raza - M Shopping Hub" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:title" content="M Shopping Hub | Welcome from Raza" />
    <meta property="og:description" content="A modern, premium, mobile-friendly marketplace featuring curated products with direct purchase links, role-based admin controls, and interactive user saves and reviews." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "M Shopping Hub",
      "alternateName": "Welcome from Raza",
      "description": "Curated direct purchase marketplace with verified brand products.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
